    <style>
        /* FullPage Scroll setup */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        
        .fullpage-container {
            position: relative;
            height: 100vh;
            width: 100%;
        }
        
        /* Navigation dots styling */
        .fp-navigation {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .fp-nav-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.8);
            display: block;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .fp-nav-dot.active {
            background-color: rgba(255, 255, 255, 0.9);
            transform: scale(1.2);
        }
        
        .fp-nav-dot:hover {
            background-color: rgba(255, 255, 255, 0.8);
        }
        
        /* Section styling */
        section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        .section-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Parallax backgrounds */
        .parallax-bg,
        [class*="parallax-bg-"] {
            position: absolute;
            top: -10%;
            left: 0;
            width: 100%;
            height: 120%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
